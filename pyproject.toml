[project]
name = "national-id-mcp"
version = "0.1.0"
description = "National ID & Tax ID Validator MCP: validate and decode national IDs, tax IDs and passport MRZ of 127 countries and territories via RapidAPI or Apify"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3"]

[project.scripts]
national-id-mcp = "national_id_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["national_id_mcp.py"]
